<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Animated Glow Gradients -->
    <radialGradient id="glowPulse1" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPulse2" cx="75%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>

    <linearGradient id="flowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Filter for soft neon glows -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatOpposite {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .flow-path {
        stroke-dasharray: 8 6;
        animation: flowDash 2.5s linear infinite;
      }
      .floating-pill-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatOpposite 6s ease-in-out infinite;
      }
      .pulse-halo {
        transform-origin: 300px 100px;
        animation: pulseLight 6s ease-in-out infinite;
      }
      .pulse-halo-2 {
        transform-origin: 900px 280px;
        animation: pulseLight 7s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bgGrad)" rx="16" />

  <!-- Ambient Animated Lighting Halos (Background layer) -->
  <circle class="pulse-halo" cx="300" cy="110" r="260" fill="url(#glowPulse1)" />
  <circle class="pulse-halo-2" cx="920" cy="260" r="280" fill="url(#glowPulse2)" />

  <!-- Geometric Grid Accent Overlay (Background layer) -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="250" y1="0" x2="250" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="550" y1="0" x2="550" y2="380" />
    <line x1="700" y1="0" x2="700" y2="380" />
    <line x1="850" y1="0" x2="850" y2="380" />
    <line x1="1000" y1="0" x2="1000" y2="380" />
    <line x1="1150" y1="0" x2="1150" y2="380" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="230" x2="1200" y2="230" />
    <line x1="0" y1="310" x2="1200" y2="310" />
  </g>

  <!-- Animated Workflow Automation Flow Lines (Behind text, around perimeter) -->
  <g opacity="0.45">
    <!-- Top-left to bottom-right flow -->
    <path class="flow-path" d="M 80 45 Q 350 15 600 45 T 1120 45" fill="none" stroke="url(#flowLineGrad)" stroke-width="2.5" />
    <path class="flow-path" d="M 80 335 Q 350 365 600 335 T 1120 335" fill="none" stroke="url(#flowLineGrad)" stroke-width="2.5" />
  </g>

  <!-- Left Dynamic Status Pill (Non-overlapping with central text) -->
  <g class="floating-pill-1" transform="translate(60, 105)">
    <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
    <circle cx="24" cy="21" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e0f2fe">Self-Service Portal</text>
  </g>

  <!-- Left Dynamic Status Pill 2 -->
  <g class="floating-pill-2" transform="translate(90, 225)">
    <rect width="175" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2" />
    <circle cx="24" cy="21" r="5" fill="#818cf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">Multi-Tier Approvals</text>
  </g>

  <!-- Right Dynamic Status Pill 1 -->
  <g class="floating-pill-2" transform="translate(950, 105)">
    <rect width="185" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.2" />
    <circle cx="24" cy="21" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#d1fae5">Zero-Touch Fulfillment</text>
  </g>

  <!-- Right Dynamic Status Pill 2 -->
  <g class="floating-pill-1" transform="translate(970, 225)">
    <rect width="165" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.2" />
    <circle cx="24" cy="21" r="5" fill="#c084fc">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f3e8ff">SLA &amp; Audit Engine</text>
  </g>

  <!-- Central Prominent Content Area (Guaranteed Foreground, No Overlap) -->
  <!-- Top Category Chip -->
  <g transform="translate(485, 52)">
    <rect width="230" height="30" rx="15" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(129, 140, 248, 0.6)" stroke-width="1.2" />
    <text x="115" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#a5b4fc">ENTERPRISE ITSM &amp; ESM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#textGrad)">Awesome Request Management</text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">
    Curated Directory of Service Catalogs, Approval Workflows, ITSM/ESM Platforms &amp; Fulfillment Automation
  </text>

  <!-- Bottom Core Pillars Badges -->
  <g transform="translate(290, 245)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" />
    <text x="65" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">📋 Service Catalogs</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="150" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" />
    <text x="220" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">⚙️ Workflow Engines</text>

    <!-- Pill 3 -->
    <rect x="310" y="0" width="140" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" />
    <text x="380" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">⏱️ SLA Governance</text>

    <!-- Pill 4 -->
    <rect x="465" y="0" width="155" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" />
    <text x="542" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">🔓 Open Source &amp; SaaS</text>
  </g>

  <!-- Subtle Bottom Border Indicator -->
  <rect x="16" y="374" width="1168" height="2" fill="url(#flowLineGrad)" opacity="0.6" rx="1" />
</svg>
